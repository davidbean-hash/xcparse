name: Release Binary

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build for arm64
        run: swift build -c release --arch arm64

      - name: Build for x86_64
        run: swift build -c release --arch x86_64

      - name: Create universal binary
        run: |
          mkdir -p .build/universal
          lipo -create \
            .build/arm64-apple-macosx/release/xcparse \
            .build/x86_64-apple-macosx/release/xcparse \
            -output .build/universal/xcparse

      - name: Verify universal binary
        run: |
          file .build/universal/xcparse
          lipo -info .build/universal/xcparse
          .build/universal/xcparse --help

      - name: Package binary
        run: |
          cd .build/universal
          tar -czf xcparse-${{ github.event.release.tag_name }}-macos-universal.tar.gz xcparse
          shasum -a 256 xcparse-${{ github.event.release.tag_name }}-macos-universal.tar.gz > xcparse-${{ github.event.release.tag_name }}-macos-universal.tar.gz.sha256
          echo "SHA256 checksum:"
          cat xcparse-${{ github.event.release.tag_name }}-macos-universal.tar.gz.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            .build/universal/xcparse-${{ github.event.release.tag_name }}-macos-universal.tar.gz
            .build/universal/xcparse-${{ github.event.release.tag_name }}-macos-universal.tar.gz.sha256
