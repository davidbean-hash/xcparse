name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: ['15.4', '16.0']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode version
      run: |
        XCODE_PATH="/Applications/Xcode_${{ matrix.xcode }}.app"
        if [ -d "$XCODE_PATH" ]; then
          sudo xcode-select -s "$XCODE_PATH"
        else
          echo "Xcode ${{ matrix.xcode }} not found, using default"
        fi

    - name: Show Swift version
      run: swift --version

    - name: Show xcresulttool version
      run: xcrun xcresulttool version || true

    - name: Build
      run: swift build -c release --disable-sandbox

    - name: Run tests
      run: swift test --disable-sandbox

    - name: Test make install
      run: |
        make build
        sudo make install
        xcparse version
        sudo make uninstall
